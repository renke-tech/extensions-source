name: Build Shinigami
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :src:id:shinigami:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shinigami-apk
          path: src/id/shinigami/build/outputs/apk/debug/*.apk
